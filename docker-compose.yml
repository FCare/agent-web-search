services:
  search:
    build:
      context: .
    container_name: search
    environment:
      MQTT_HOST: ${MQTT_HOST:-mosquitto-broker}
      MQTT_PORT: ${MQTT_PORT:-1883}
      AUTHENTIK_URL: ${AUTHENTIK_URL:-https://sso.caronboulme.fr}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET}
      DEFAULT_N_RESULTS: ${DEFAULT_N_RESULTS:-8}
      FETCH_TOP_N: ${FETCH_TOP_N:-8}
      FETCH_TIMEOUT: ${FETCH_TIMEOUT:-3}
      RESULT_MAX_CHARS: ${RESULT_MAX_CHARS:-800}
      BACKGROUND_N: ${BACKGROUND_N:-6}
      RECENT_N: ${RECENT_N:-5}
      CONTEXT_TTL_SECONDS: ${CONTEXT_TTL_SECONDS:-7200}
      ANYSEARCH_API_KEY: ${ANYSEARCH_API_KEY:-}
      DDGS_TEXT_BACKENDS: ${DDGS_TEXT_BACKENDS:-bing,yandex,yahoo}
      DDGS_NEWS_BACKENDS: ${DDGS_NEWS_BACKENDS:-bing,duckduckgo}
      DDGS_REGION: ${DDGS_REGION:-fr-fr}
    networks:
      - ansible
    restart: unless-stopped

networks:
  ansible:
    external: true
