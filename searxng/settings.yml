use_default_settings: true

server:
  secret_key: "change_me_in_production_please"
  limiter: false
  image_proxy: true
  http_protocol_version: "1.1"

ui:
  static_use_hash: true
  default_theme: simple
  default_locale: fr

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "fr-FR"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

outgoing:
  request_timeout: 15.0
  max_request_timeout: 30.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  # --- General ---
  - name: google
    engine: google
    categories: general, news
    disabled: false
    weight: 2

  - name: bing
    engine: bing
    categories: general, news, images
    disabled: false

  - name: duckduckgo
