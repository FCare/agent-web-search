use_default_settings: true

server:
  secret_key: "change_me_in_production_please"
  limiter: false
  image_proxy: true
  http_protocol_version: "1.1"

ui:
  static_use_hash: true
  default_theme: simple
  default_locale: fr

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "fr-FR"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  # Les moteurs marqués disabled ci-dessous nous répondent CAPTCHA, 429 ou
  # "accès refusé" depuis cette IP (mesuré le 28/07/2026). Les laisser actifs
  # ne rapporte aucun résultat et fait payer leur timeout à chaque requête.
  # Les catégories general et news ne passent plus par SearXNG de toute façon,
  # elles sont servies par ddgs (voir _ddgs_search dans main.py).

  # --- General ---
  - name: google
    engine: google
    categories: general, news
    disabled: true
    weight: 2

  - name: bing
    engine: bing
    categories: general, news, images
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    categories: general, news, images
    disabled: false

  - name: brave
    engine: brave
    categories: general, news
    disabled: true

  - name: qwant
    engine: qwant
    categories: general, news, images
    disabled: true
    weight: 2

  - name: startpage
    engine: startpage
    categories: general
    disabled: true

  - name: mojeek
    engine: mojeek
    categories: general
    disabled: true

  # --- Knowledge ---
  - name: wikipedia
    engine: wikipedia
    categories: general
    disabled: false
    weight: 2

  - name: wikidata
    engine: wikidata
    categories: general
    disabled: false

  # --- News ---
  - name: google news
    engine: google_news
    categories: news
    disabled: false
    weight: 2

  - name: bing news
    engine: bing_news
    categories: news
    disabled: false

  - name: yahoo news
    engine: yahoo_news
    categories: news
    disabled: false

  # --- Science ---
  - name: arxiv
    engine: arxiv
    categories: science
    disabled: false

  - name: semantic scholar
    engine: semantic_scholar
    categories: science
    disabled: false

  - name: pubmed
    engine: pubmed
    categories: science
    disabled: false

  # --- Site-specific ---
  - name: korben.info
    engine: xpath
    url: https://www.bing.com/search?q=site%3Akorben.info+{query}&setlang=fr
    url_xpath: //li[contains(@class,"b_algo")]//h2/a/@href
    title_xpath: //li[contains(@class,"b_algo")]//h2/a//text()
    content_xpath: //li[contains(@class,"b_algo")]//.[@class="b_caption"]//p//text()
    categories: it, news
    disabled: false
    timeout: 10.0

  # --- IT ---
  - name: github
    engine: github
    categories: it
    disabled: false

  - name: hackernews
    engine: hackernews
    categories: it, news
    disabled: false

  - name: npm
    engine: npm
    categories: it
    disabled: false

  - name: pypi
    engine: pypi
    categories: it
    disabled: false

  # --- Social media ---
  # reddit bloque les requêtes non authentifiées ; mastodon et lemmy (défauts
  # SearXNG) portent la catégorie à eux seuls.
  - name: reddit
    engine: reddit
    categories: social media
    disabled: true

  # --- Maps ---
  # openstreetmap ne répond plus ; photon (même base de données) le remplace.
  - name: openstreetmap
    engine: openstreetmap
    categories: map
    disabled: true

  - name: photon
    engine: photon
    categories: map
    disabled: false

  # --- Music ---
  - name: genius
    engine: genius
    categories: music
    disabled: false

  # --- Videos ---
  - name: youtube
    engine: youtube_noapi
    categories: videos
    disabled: false

  - name: dailymotion
    engine: dailymotion
    categories: videos
    disabled: false

  # --- Images ---
  - name: google images
    engine: google_images
    categories: images
    disabled: true

  - name: bing images
    engine: bing_images
    categories: images
    disabled: false

  # --- Moteurs par défaut SearXNG qui ne répondent plus ---
  # Non déclarés plus haut : ils viennent de use_default_settings, on les
  # neutralise ici pour ne pas attendre leur timeout à chaque requête.
  - name: brave.news
    engine: brave
    disabled: true

  - name: brave.images
    engine: brave
    disabled: true

  - name: brave.videos
    engine: brave
    disabled: true

  - name: google videos
    engine: google_videos
    disabled: true

  - name: startpage news
    engine: startpage
    disabled: true

  - name: startpage images
    engine: startpage
    disabled: true

  - name: duckduckgo images
    engine: duckduckgo_extra
    disabled: true

  - name: reuters
    engine: reuters
    disabled: true

  - name: tootfinder
    engine: tootfinder
    disabled: true

  - name: vimeo
    engine: vimeo
    disabled: true

  - name: pexels
    engine: pexels
    disabled: true

